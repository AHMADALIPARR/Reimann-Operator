name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Fortran kernels + C23 ports (golden + oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j1
      - name: ctest
        run: ctest --test-dir build -j1 --output-on-failure

  lean:
    name: Lean (lean-checked, lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-checked
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: lake build
        run: lake build
      - name: Axioms (fails on sorryAx)
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then exit 1; fi
      - name: No sorry / admit in the checked sources
        run: |
          if grep -rnwE 'sorry|admit' --include=*.lean ReimannOperatorChecked ReimannOperatorChecked.lean; then exit 1; fi
