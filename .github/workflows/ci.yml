name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Fortran kernels, C23 and Prolog ports (golden + oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran and SWI-Prolog
        run: sudo apt-get update && sudo apt-get install -y gfortran swi-prolog-nox
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRO_REQUIRE_PROLOG=ON
      - name: Build
        run: cmake --build build -j1
      - name: ctest
        run: ctest --test-dir build -j1 --output-on-failure

  lean:
    name: Lean (lean-checked, lake build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean-checked
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: lake build
        run: lake build
      - name: Axioms (fails on sorryAx)
        run: |
          lake env lean AxiomCheck.lean | tee axioms.txt
          if grep -q sorryAx axioms.txt; then exit 1; fi
      - name: No sorry / admit in the checked sources
        run: |
          if grep -rnwE 'sorry|admit' --include=*.lean ReimannOperatorChecked ReimannOperatorChecked.lean; then exit 1; fi
      - name: Axioms of lean/SovereignRHLock.lean (fails on sorryAx)
        run: |
          lake env lean AxiomCheckSovereign.lean | tee axioms_sovereign.txt
          if grep -q sorryAx axioms_sovereign.txt; then exit 1; fi
          # only Lean's built-in axioms are allowed (no sorryAx, no custom axioms)
          if grep 'depends on axioms' axioms_sovereign.txt | grep -vE '\[((propext|Quot\.sound|Classical\.choice)(, )?)+\]$'; then exit 1; fi

  paper:
    name: Paper (LaTeX build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build paper/sovereign_rh_lock.tex
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: sovereign_rh_lock.tex
